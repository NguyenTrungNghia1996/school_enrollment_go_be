services:
  app:
    image: trungnghia1996/school_enrollment_go_be:latest
    container_name: school_enrollment_go_be
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "Enrollment System"
      APP_ENV: production
      APP_PORT: "8080"
      APP_READ_TIMEOUT: 10s
      APP_WRITE_TIMEOUT: 10s
      APP_IDLE_TIMEOUT: 30s
      APP_SHUTDOWN_TIMEOUT: 10s
      API_PREFIX: /api/v1
      DB_HOST: 103.47.224.231
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: password123
      DB_NAME: school_enrollment
      DB_SSLMODE: disable
      DB_TIMEZONE: Asia/Ho_Chi_Minh
      DB_MAX_IDLE_CONNS: "10"
      DB_MAX_OPEN_CONNS: "50"
      DB_CONN_MAX_LIFETIME: 30m
      JWT_SECRET: super_secret_for_jwt_change_in_production
      JWT_ISSUER: school_enrollment_go_be
      JWT_EXPIRES_IN: 24h
      LOG_LEVEL: info
      CORS_ALLOW_ORIGINS: "*"
      CORS_ALLOW_HEADERS: Origin,Content-Type,Accept,Authorization
      CORS_ALLOW_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      MIGRATIONS_PATH: file://migrations
    restart: unless-stopped
