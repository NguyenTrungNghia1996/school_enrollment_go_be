services:
  app:
    image: trungnghia1996/school_enrollment_go_be:latest
    container_name: school_enrollment_go_be
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "Enrollment System"
      APP_ENV: production
      APP_PORT: "8080"
      APP_TIMEZONE: Asia/Ho_Chi_Minh
      DB_HOST: 103.47.224.231
      DB_PORT: "5432"
      DB_NAME: school_enrollment
      DB_USER: postgres
      DB_PASSWORD: password123
      DB_SSLMODE: disable
      ADMIN_JWT_SECRET: super_secret_for_admin_jwt_change_in_production
      ADMIN_JWT_EXPIRES_IN: 24h
      USER_JWT_SECRET: super_secret_for_user_jwt_change_in_production
      USER_JWT_EXPIRES_IN: 24h
      CORS_ALLOW_ORIGINS: "*"
    restart: unless-stopped
