openapi: 3.0.3
info:
  title: School Enrollment Backend API
  version: 1.0.0
  description: OpenAPI specification for the School Enrollment backend.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Admin Auth
    description: Authentication endpoints for admin users
  - name: User Auth
    description: Authentication endpoints for end users
  - name: Health
    description: Service health check endpoints
paths:
  /api/v1/admin/auth/login:
    post:
      tags:
        - Admin Auth
      summary: Admin login
      description: Authenticate an admin user with username and password.
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
            example:
              username: admin
              password: admin
      responses:
        '200':
          description: Admin login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginSuccessResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin account is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/auth/me:
    get:
      tags:
        - Admin Auth
      summary: Get current admin profile
      description: Retrieve the current authenticated admin profile from an admin bearer token.
      operationId: getAdminMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Admin profile fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeSuccessResponse'
        '401':
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin account is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/user/auth/login:
    post:
      tags:
        - User Auth
      summary: User login
      description: Authenticate a user with username and password.
      operationId: userLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
            example:
              username: student01
              password: secret123
      responses:
        '200':
          description: User login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginSuccessResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User account is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/user/auth/me:
    get:
      tags:
        - User Auth
      summary: Get current user profile
      description: Retrieve the current authenticated user profile from a user bearer token.
      operationId: getUserMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeSuccessResponse'
        '401':
          description: Missing or invalid user token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User account is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check service availability and return application and database health.
      operationId: getHealth
      responses:
        '200':
          description: Health check successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckSuccessResponse'
        '503':
          description: Health check failed because the database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckSuccessResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AdminLoginRequest:
      type: object
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: admin
      required:
        - username
        - password
    UserLoginRequest:
      type: object
      properties:
        username:
          type: string
          example: student01
        password:
          type: string
          example: secret123
      required:
        - username
        - password
    GenericSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          type: object
          nullable: true
      required:
        - success
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/APIError'
      required:
        - success
        - error
    APIError:
      type: object
      properties:
        code:
          type: string
          example: INVALID_CREDENTIALS
        message:
          type: string
          example: Username or password is incorrect
        details:
          nullable: true
      required:
        - code
        - message
    AdminProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: admin
        full_name:
          type: string
          example: Default Admin
        email:
          type: string
          nullable: true
          example: admin@example.com
        phone_number:
          type: string
          nullable: true
          example: "0900000000"
        is_super_admin:
          type: boolean
          example: true
        is_active:
          type: boolean
          example: true
      required:
        - id
        - username
        - full_name
        - is_super_admin
        - is_active
    AdminLoginData:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        admin:
          $ref: '#/components/schemas/AdminProfile'
      required:
        - access_token
        - admin
    AdminLoginSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Admin login successful
        data:
          $ref: '#/components/schemas/AdminLoginData'
      required:
        - success
        - message
        - data
    AdminMeSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Fetched admin profile successfully
        data:
          $ref: '#/components/schemas/AdminProfile'
      required:
        - success
        - message
        - data
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: student01
        full_name:
          type: string
          example: Nguyen Van A
        email:
          type: string
          nullable: true
          example: student01@example.com
        phone_number:
          type: string
          nullable: true
          example: "0900000001"
        is_active:
          type: boolean
          example: true
      required:
        - id
        - username
        - full_name
        - is_active
    UserLoginData:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        user:
          $ref: '#/components/schemas/UserProfile'
      required:
        - access_token
        - user
    UserLoginSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User login successful
        data:
          $ref: '#/components/schemas/UserLoginData'
      required:
        - success
        - message
        - data
    UserMeSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Fetched user profile successfully
        data:
          $ref: '#/components/schemas/UserProfile'
      required:
        - success
        - message
        - data
    HealthCheckApp:
      type: object
      properties:
        name:
          type: string
          example: school-enrollment-be
        environment:
          type: string
          example: local
        status:
          type: string
          example: ok
        time:
          type: string
          format: date-time
          example: '2026-04-24T00:00:00Z'
      required:
        - name
        - environment
        - status
        - time
    HealthCheckDB:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
        - status
    HealthCheckData:
      type: object
      properties:
        app:
          $ref: '#/components/schemas/HealthCheckApp'
        db:
          $ref: '#/components/schemas/HealthCheckDB'
      required:
        - app
        - db
    HealthCheckSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Service is healthy
        data:
          $ref: '#/components/schemas/HealthCheckData'
      required:
        - success
        - message
        - data
