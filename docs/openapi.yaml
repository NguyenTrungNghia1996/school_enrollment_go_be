openapi: 3.0.3
info:
  title: School Enrollment Backend API
  version: 1.0.0
  description: OpenAPI specification for the School Enrollment backend.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Health
    description: Service health check endpoints
paths:
  /api/v1/health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check service availability and return application and database health.
      operationId: getHealth
      responses:
        '200':
          description: Health check successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckSuccessResponse'
        '503':
          description: Health check failed because the database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckSuccessResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    GenericSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          type: object
          nullable: true
      required:
        - success
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Bad request
        error:
          nullable: true
      required:
        - success
        - message
    HealthCheckApp:
      type: object
      properties:
        name:
          type: string
          example: school-enrollment-be
        environment:
          type: string
          example: local
        status:
          type: string
          example: ok
        time:
          type: string
          format: date-time
          example: '2026-04-24T00:00:00Z'
      required:
        - name
        - environment
        - status
        - time
    HealthCheckDB:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
        - status
    HealthCheckData:
      type: object
      properties:
        app:
          $ref: '#/components/schemas/HealthCheckApp'
        db:
          $ref: '#/components/schemas/HealthCheckDB'
      required:
        - app
        - db
    HealthCheckSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Service is healthy
        data:
          $ref: '#/components/schemas/HealthCheckData'
      required:
        - success
        - message
        - data
