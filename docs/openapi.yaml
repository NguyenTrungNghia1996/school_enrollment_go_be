openapi: 3.0.3
info:
  title: School Enrollment Backend API
  version: 1.0.0
  description: OpenAPI specification for the School Enrollment backend.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Admin Auth
    description: Authentication endpoints for admin users
  - name: Admin Users
    description: Management endpoints for admin users
  - name: Menus
    description: Management endpoints for menus by admin
  - name: Role Groups
    description: Management endpoints for role groups by admin
  - name: Users
    description: Management endpoints for end users by admin
  - name: User Auth
    description: Authentication endpoints for end users
  - name: Health
    description: Service health check endpoints
paths:
  /api/v1/admin/auth/login:
    post:
      tags:
        - Admin Auth
      summary: Admin login
      description: Authenticate an admin user with username and password.
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
            example:
              username: admin
              password: admin
      responses:
        '200':
          description: Admin login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginSuccessResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin account is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/auth/me:
    get:
      tags:
        - Admin Auth
      summary: Get current admin profile
      description: Retrieve the current authenticated admin profile from an admin bearer token.
      operationId: getAdminMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Admin profile fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeSuccessResponse'
        '401':
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin account is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/admin-users:
    get:
      tags:
        - Admin Users
      summary: List admin users
      description: Retrieve admin users with filters and pagination.
      operationId: listAdminUsers
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            example: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
        - in: query
          name: keyword
          schema:
            type: string
            example: admin
        - in: query
          name: is_active
          schema:
            type: boolean
            example: true
        - in: query
          name: is_super_admin
          schema:
            type: boolean
            example: false
        - in: query
          name: sort_by
          schema:
            type: string
            example: created_at
        - in: query
          name: sort_order
          schema:
            type: string
            enum: [asc, desc]
            example: desc
      responses:
        '200':
          description: Admin users fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListSuccessResponse'
        '400':
          description: Invalid filters or pagination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin account is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Admin Users
      summary: Create admin user
      description: Create a new admin user.
      operationId: createAdminUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminUserRequest'
            example:
              username: manager01
              password: secret123
              full_name: Manager 01
              email: manager01@example.com
              phone_number: "0900000002"
              is_super_admin: false
              is_active: true
              role_group_ids: [1, 2]
      responses:
        '201':
          description: Admin user created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserSuccessResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/admin-users/{id}:
    get:
