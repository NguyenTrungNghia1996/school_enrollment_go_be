components:
  parameters:
    AdminUserId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 1
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AdminLoginRequest:
      type: object
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: admin
      required:
        - username
        - password
    UserLoginRequest:
      type: object
      properties:
        username:
          type: string
          example: student01
        password:
          type: string
          example: secret123
      required:
        - username
        - password
    GenericSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          type: object
          nullable: true
      required:
        - success
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/APIError'
      required:
        - success
        - error
    APIError:
      type: object
      properties:
        code:
          type: string
          example: INVALID_CREDENTIALS
        message:
          type: string
          example: Username or password is incorrect
        details:
          nullable: true
      required:
        - code
        - message
    AdminProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: admin
        full_name:
          type: string
          example: Default Admin
        email:
          type: string
          nullable: true
          example: admin@example.com
        phone_number:
          type: string
          nullable: true
          example: "0900000000"
        is_super_admin:
          type: boolean
          example: true
        is_active:
          type: boolean
          example: true
      required:
        - id
        - username
        - full_name
        - is_super_admin
        - is_active
